<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4dc0"/>
      <stop offset="1" stop-color="#df3d77"/>
    </linearGradient>
  </defs>
  <!-- lâmina / espécime -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <!-- grade de spots de captura espacial -->
  <g fill="#ffffff" opacity="0.32">
    <circle cx="18" cy="18" r="3"/>
    <circle cx="32" cy="18" r="3"/>
    <circle cx="46" cy="18" r="3"/>
    <circle cx="18" cy="32" r="3"/>
    <circle cx="46" cy="32" r="3"/>
    <circle cx="18" cy="46" r="3"/>
    <circle cx="32" cy="46" r="3"/>
    <circle cx="46" cy="46" r="3"/>
  </g>
  <!-- hotspots de expressão: fluorescência ciano + verde + núcleo brilhante -->
  <circle cx="32" cy="32" r="6.5" fill="#ffffff"/>
  <circle cx="18" cy="32" r="3.4" fill="#19b6c4"/>
  <circle cx="32" cy="46" r="3.4" fill="#34d69e"/>
  <circle cx="46" cy="18" r="3.4" fill="#ffe08a"/>
</svg>
