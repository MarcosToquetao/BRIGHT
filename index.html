<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIGHT — Spatial Transcriptomics Catalog</title>
  <meta name="description" content="Brazilian Resource for Integrated Genomics, Histology and Transcriptomics — open, curated catalog of spatial transcriptomics datasets." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="#catalog">
        <img class="logo" src="assets/logo.svg" alt="BRIGHT" />
        <span>
          BRIGHT
          <span class="brand-sub" data-i18n="site.tagline"></span>
        </span>
      </a>
      <nav class="nav-links">
        <a href="#catalog" data-i18n="nav.catalog"></a>
        <a href="#dashboard" data-i18n="nav.dashboard"></a>
        <a href="#submit" data-i18n="nav.submit"></a>
        <a href="#about" data-i18n="nav.about"></a>
        <span class="lang-toggle">
          <button data-lang="pt">PT</button>
          <button data-lang="en">EN</button>
        </span>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- ===== View: Catalog ===== -->
    <section id="view-catalog" class="view">
      <div class="hero">
        <div class="hero-copy">
          <span class="eyebrow" data-i18n="hero.eyebrow"></span>
          <h1 data-i18n="hero.title"></h1>
          <p data-i18n="hero.subtitle"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#catalog-list" data-i18n="hero.cta.explore"></a>
            <a class="btn btn-ghost" href="#submit" data-i18n="hero.cta.submit"></a>
          </div>
        </div>
        <div class="hero-figure" aria-hidden="true">
          <svg viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg" role="img">
            <defs>
              <radialGradient id="tissue" cx="40%" cy="36%" r="72%">
                <stop offset="0%" stop-color="#f7b7cf"/>
                <stop offset="42%" stop-color="#c98fd9"/>
                <stop offset="78%" stop-color="#8257c4"/>
                <stop offset="100%" stop-color="#5a399e"/>
              </radialGradient>
              <pattern id="spots" width="22" height="22" patternUnits="userSpaceOnUse">
                <circle cx="11" cy="11" r="2.3" fill="#2c1850" opacity="0.28"/>
              </pattern>
              <clipPath id="blob">
                <path d="M232 36 C322 32 412 104 416 206 C420 300 372 408 250 418 C156 426 64 372 50 262 C36 158 122 40 232 36 Z"/>
              </clipPath>
              <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="6"/>
              </filter>
            </defs>
            <g clip-path="url(#blob)">
              <rect x="0" y="0" width="460" height="460" fill="url(#tissue)"/>
              <rect x="0" y="0" width="460" height="460" fill="url(#spots)"/>
            </g>
            <path d="M232 36 C322 32 412 104 416 206 C420 300 372 408 250 418 C156 426 64 372 50 262 C36 158 122 40 232 36 Z"
                  fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
            <g class="hotspots">
              <circle class="spot" cx="158" cy="150" r="9"  fill="#19b6c4"/>
              <circle class="spot" cx="262" cy="120" r="6"  fill="#45d69e"/>
              <circle class="spot" cx="330" cy="206" r="11" fill="#ff6fa3"/>
              <circle class="spot" cx="196" cy="258" r="7"  fill="#ffb454"/>
              <circle class="spot" cx="288" cy="306" r="9"  fill="#19b6c4"/>
              <circle class="spot" cx="120" cy="232" r="6"  fill="#45d69e"/>
              <circle class="spot" cx="356" cy="300" r="7"  fill="#ff6fa3"/>
              <circle class="spot" cx="232" cy="200" r="13" fill="#ffe08a"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card" style="--accent:var(--c1)">
          <div class="stat-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
          </div>
          <div class="stat-text"><div class="num" id="stat-datasets">—</div><div class="lbl" data-i18n="stat.datasets"></div></div>
        </div>
        <div class="stat-card" style="--accent:var(--c3)">
          <div class="stat-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6.5L5.5 17a3 3 0 0 0 2.6 4.5h7.8a3 3 0 0 0 2.6-4.5L14 9.5V3"/><path d="M7.5 14h9"/></svg>
          </div>
          <div class="stat-text"><div class="num" id="stat-samples">—</div><div class="lbl" data-i18n="stat.samples"></div></div>
        </div>
        <div class="stat-card" style="--accent:var(--c7)">
          <div class="stat-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 0 0-5 5c0 1.5.5 2.3 1 3s1 1.3 1 2.5a3 3 0 0 1-3 3 2 2 0 0 0 0 4h12a2 2 0 0 0 0-4 3 3 0 0 1-3-3c0-1.2.5-1.8 1-2.5s1-1.5 1-3a5 5 0 0 0-5-5Z"/><circle cx="12" cy="7" r="1.2" fill="currentColor"/></svg>
          </div>
          <div class="stat-text"><div class="num" id="stat-tissues">—</div><div class="lbl" data-i18n="stat.tissues"></div></div>
        </div>
        <div class="stat-card" style="--accent:var(--c2)">
          <div class="stat-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v2M14 3v2M10 19v2M14 19v2M3 10h2M3 14h2M19 10h2M19 14h2"/></svg>
          </div>
          <div class="stat-text"><div class="num" id="stat-tech">—</div><div class="lbl" data-i18n="stat.technologies"></div></div>
        </div>
      </div>

      <div class="section" id="catalog-list">
        <div class="section-head">
          <h2 data-i18n="catalog.title"></h2>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="search" data-i18n-ph="catalog.search" />
          </div>
        </div>

        <div class="filters" id="filters"><!-- filtros gerados via JS --></div>

        <div class="results-bar">
          <span id="results-count"></span>
          <button class="link-btn" id="clear-filters" data-i18n="catalog.clear"></button>
        </div>

        <div class="card-grid" id="card-grid">
          <div class="loading" data-i18n="catalog.loading"></div>
        </div>
      </div>
    </section>

    <!-- ===== View: Detail ===== -->
    <section id="view-detail" class="view">
      <div class="section" id="detail-content"></div>
    </section>

    <!-- ===== View: Dashboard ===== -->
    <section id="view-dashboard" class="view">
      <div class="section">
        <div class="section-head">
          <h2 data-i18n="dashboard.title"></h2>
          <p data-i18n="dashboard.subtitle"></p>
        </div>
        <div class="dash-grid">
          <div class="chart-card span-2">
            <h3 data-i18n="dashboard.byTech"></h3>
            <div class="chart-holder"><canvas id="chart-tech"></canvas></div>
          </div>
          <div class="chart-card span-2">
            <h3 data-i18n="dashboard.samplesByTech"></h3>
            <div class="chart-holder"><canvas id="chart-samples-tech"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="dashboard.byOrganism"></h3>
            <div class="chart-holder"><canvas id="chart-organism"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="dashboard.tumor"></h3>
            <div class="chart-holder"><canvas id="chart-tumor"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="dashboard.byTissue"></h3>
            <div class="chart-holder"><canvas id="chart-tissue"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="dashboard.byCancer"></h3>
            <div class="chart-holder"><canvas id="chart-cancer"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="dashboard.byHE"></h3>
            <div class="chart-holder"><canvas id="chart-he"></canvas></div>
          </div>
          <div class="chart-card">
            <h3 data-i18n="dashboard.byFixation"></h3>
            <div class="chart-holder"><canvas id="chart-fixation"></canvas></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== View: Submit ===== -->
    <section id="view-submit" class="view">
      <div class="section">
        <div class="section-head">
          <h2 data-i18n="submit.title"></h2>
          <p data-i18n="submit.subtitle"></p>
        </div>
        <div class="steps">
          <div class="step">
            <div class="step-ico">1</div>
            <h3 data-i18n="submit.step1.title"></h3>
            <p data-i18n="submit.step1.text"></p>
          </div>
          <div class="step">
            <div class="step-ico">2</div>
            <h3 data-i18n="submit.step2.title"></h3>
            <p data-i18n="submit.step2.text"></p>
          </div>
          <div class="step">
            <div class="step-ico">3</div>
            <h3 data-i18n="submit.step3.title"></h3>
            <p data-i18n="submit.step3.text"></p>
          </div>
        </div>
        <a class="btn btn-primary" id="submit-form-link" target="_blank" rel="noopener" data-i18n="submit.cta"></a>
      </div>
    </section>

    <!-- ===== View: About ===== -->
    <section id="view-about" class="view">
      <div class="section">
        <div class="section-head">
          <h2 data-i18n="about.title"></h2>
        </div>
        <div class="prose">
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
        </div>
        <div class="about-cards">
          <div class="about-card">
            <h3 data-i18n="about.contribute.title"></h3>
            <p data-i18n="about.contribute.text"></p>
          </div>
          <div class="about-card">
            <h3 data-i18n="about.cite.title"></h3>
            <p data-i18n="about.cite.text"></p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container">
      <span data-i18n="footer.text"></span>
      <span>© BRIGHT</span>
    </div>
  </footer>

  <!-- Chart.js (dashboard) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- App -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
