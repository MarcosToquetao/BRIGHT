<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRIGHT — Catálogo de transcriptômica espacial</title>
  <meta name="description" content="Catálogo aberto e curado de datasets de transcriptômica espacial: metadados e caminhos de download de estudos públicos." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>

<!-- ===== Notação: geometria de captura de cada tecnologia =====
     Cada tecnologia espacial amostra o tecido de um jeito. Estes glifos
     desenham essa geometria, no tamanho do texto, para que a tecnologia
     seja reconhecível antes de ser lida. São notação, não ilustração. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Visium: rede hexagonal de spots de 55 µm -->
    <symbol id="geo-visium" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="1.7"/><circle cx="12.6" cy="8" r="1.7"/>
      <circle cx="10.3" cy="4" r="1.7"/><circle cx="5.7" cy="4" r="1.7"/>
      <circle cx="3.4" cy="8" r="1.7"/><circle cx="5.7" cy="12" r="1.7"/>
      <circle cx="10.3" cy="12" r="1.7"/>
    </symbol>
    <!-- Visium HD: malha quadrada contínua de 2 µm -->
    <symbol id="geo-visium-hd" viewBox="0 0 16 16">
      <rect x="1.2" y="1.2" width="2.8" height="2.8"/><rect x="4.8" y="1.2" width="2.8" height="2.8"/>
      <rect x="8.4" y="1.2" width="2.8" height="2.8"/><rect x="12" y="1.2" width="2.8" height="2.8"/>
      <rect x="1.2" y="4.8" width="2.8" height="2.8"/><rect x="4.8" y="4.8" width="2.8" height="2.8"/>
      <rect x="8.4" y="4.8" width="2.8" height="2.8"/><rect x="12" y="4.8" width="2.8" height="2.8"/>
      <rect x="1.2" y="8.4" width="2.8" height="2.8"/><rect x="4.8" y="8.4" width="2.8" height="2.8"/>
      <rect x="8.4" y="8.4" width="2.8" height="2.8"/><rect x="12" y="8.4" width="2.8" height="2.8"/>
      <rect x="1.2" y="12" width="2.8" height="2.8"/><rect x="4.8" y="12" width="2.8" height="2.8"/>
      <rect x="8.4" y="12" width="2.8" height="2.8"/><rect x="12" y="12" width="2.8" height="2.8"/>
    </symbol>
    <!-- Xenium: transcritos individuais, nuvem de pontos -->
    <symbol id="geo-xenium" viewBox="0 0 16 16">
      <circle cx="3.1" cy="4.2" r="1"/><circle cx="7.4" cy="2.6" r="1"/>
      <circle cx="11.8" cy="4.6" r="1"/><circle cx="5.2" cy="7.4" r="1"/>
      <circle cx="9.6" cy="7.1" r="1"/><circle cx="13.2" cy="8.8" r="1"/>
      <circle cx="2.6" cy="9.8" r="1"/><circle cx="6.8" cy="11.2" r="1"/>
      <circle cx="11" cy="12.1" r="1"/><circle cx="4" cy="13.4" r="1"/>
    </symbol>
    <!-- MERFISH: moléculas barcodadas, agrupadas -->
    <symbol id="geo-merfish" viewBox="0 0 16 16">
      <circle cx="4" cy="3.4" r=".95"/><circle cx="6.4" cy="4.6" r=".95"/>
      <circle cx="11.4" cy="3.2" r=".95"/><circle cx="12.8" cy="5.4" r=".95"/>
      <circle cx="3" cy="8.2" r=".95"/><circle cx="8" cy="8" r=".95"/>
      <circle cx="9.8" cy="9.4" r=".95"/><circle cx="5.6" cy="11.6" r=".95"/>
      <circle cx="7.2" cy="13.2" r=".95"/><circle cx="12.6" cy="11.8" r=".95"/>
    </symbol>
    <!-- Slide-seq: esferas empacotadas de 10 µm -->
    <symbol id="geo-slide-seq" viewBox="0 0 16 16">
      <circle cx="4.4" cy="4.4" r="2.5"/><circle cx="9.8" cy="3.6" r="1.9"/>
      <circle cx="13" cy="7" r="1.7"/><circle cx="8.2" cy="8.4" r="2.3"/>
      <circle cx="3.2" cy="9.6" r="2"/><circle cx="11.4" cy="11.6" r="2.2"/>
      <circle cx="6.2" cy="13" r="1.8"/>
    </symbol>
    <!-- Stereo-seq: rede de nanoesferas de DNA, passo nanométrico -->
    <symbol id="geo-stereo-seq" viewBox="0 0 16 16">
      <g>
        <circle cx="2" cy="2" r=".62"/><circle cx="4.8" cy="2" r=".62"/><circle cx="7.6" cy="2" r=".62"/><circle cx="10.4" cy="2" r=".62"/><circle cx="13.2" cy="2" r=".62"/>
        <circle cx="2" cy="4.8" r=".62"/><circle cx="4.8" cy="4.8" r=".62"/><circle cx="7.6" cy="4.8" r=".62"/><circle cx="10.4" cy="4.8" r=".62"/><circle cx="13.2" cy="4.8" r=".62"/>
        <circle cx="2" cy="7.6" r=".62"/><circle cx="4.8" cy="7.6" r=".62"/><circle cx="7.6" cy="7.6" r=".62"/><circle cx="10.4" cy="7.6" r=".62"/><circle cx="13.2" cy="7.6" r=".62"/>
        <circle cx="2" cy="10.4" r=".62"/><circle cx="4.8" cy="10.4" r=".62"/><circle cx="7.6" cy="10.4" r=".62"/><circle cx="10.4" cy="10.4" r=".62"/><circle cx="13.2" cy="10.4" r=".62"/>
        <circle cx="2" cy="13.2" r=".62"/><circle cx="4.8" cy="13.2" r=".62"/><circle cx="7.6" cy="13.2" r=".62"/><circle cx="10.4" cy="13.2" r=".62"/><circle cx="13.2" cy="13.2" r=".62"/>
      </g>
    </symbol>
    <!-- CosMx: campos de visão retangulares -->
    <symbol id="geo-cosmx" viewBox="0 0 16 16">
      <g fill="none" stroke="currentColor" stroke-width="1.1">
        <rect x="1.4" y="1.4" width="5.6" height="5.6"/><rect x="9" y="1.4" width="5.6" height="5.6"/>
        <rect x="1.4" y="9" width="5.6" height="5.6"/><rect x="9" y="9" width="5.6" height="5.6"/>
      </g>
      <circle cx="4.2" cy="4.2" r=".9"/><circle cx="11.8" cy="4.2" r=".9"/>
      <circle cx="4.2" cy="11.8" r=".9"/><circle cx="11.8" cy="11.8" r=".9"/>
    </symbol>
    <!-- GeoMx: regiões de interesse desenhadas à mão -->
    <symbol id="geo-geomx" viewBox="0 0 16 16">
      <path d="M5.2 1.8 L11.6 2.6 L14 7.2 L11 12.4 L5.8 14 L2 10.6 L1.9 5.2 Z"
            fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="6.6" cy="6.2" r="1.1"/><circle cx="10" cy="9.4" r="1.1"/>
    </symbol>
    <!-- seqFISH: rodadas sequenciais de hibridização -->
    <symbol id="geo-seqfish" viewBox="0 0 16 16">
      <circle cx="4.4" cy="4.4" r="1.1"/><circle cx="11.4" cy="6" r="1.1"/>
      <circle cx="6.6" cy="11.4" r="1.1"/>
      <g fill="none" stroke="currentColor" stroke-width="1">
        <circle cx="11" cy="11.8" r="2.1"/><circle cx="4" cy="8.6" r="1.8"/>
      </g>
    </symbol>
    <!-- DBiT-seq: canais microfluídicos cruzados -->
    <symbol id="geo-dbit" viewBox="0 0 16 16">
      <g stroke="currentColor" stroke-width="1.1" fill="none">
        <path d="M3.4 1.5V14.5M8 1.5V14.5M12.6 1.5V14.5"/>
        <path d="M1.5 3.4H14.5M1.5 8H14.5M1.5 12.6H14.5"/>
      </g>
    </symbol>
    <!-- Tecnologia não identificada -->
    <symbol id="geo-other" viewBox="0 0 16 16">
      <rect x="1.8" y="1.8" width="12.4" height="12.4" fill="none"
            stroke="currentColor" stroke-width="1.1" stroke-dasharray="2.4 2"/>
      <circle cx="8" cy="8" r="1.4"/>
    </symbol>

    <!-- Acesso: cheio = público, meio = sob solicitação, vazio = controlado -->
    <symbol id="acc-public" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2"/></symbol>
    <symbol id="acc-request" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8 2.8a5.2 5.2 0 0 1 0 10.4Z"/>
    </symbol>
    <symbol id="acc-controlled" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
  </defs>
</svg>

<header class="site-header">
  <div class="shell header-row">
    <a class="brand" href="#catalog">
      <img class="brand-mark" src="assets/logo.svg" alt="" aria-hidden="true" />
      <span class="brand-text">
        <span class="brand-name">BRIGHT</span>
        <span class="brand-sub" data-i18n="site.tagline"></span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Principal">
      <a href="#catalog" data-i18n="nav.catalog"></a>
      <a href="#submit" data-i18n="nav.submit"></a>
      <a href="#about" data-i18n="nav.about"></a>
    </nav>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt">PT</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>

  <!-- ============ Catálogo ============ -->
  <section id="view-catalog" class="view">

    <div class="shell">
      <p class="lead" data-i18n="lead.text"></p>
    </div>

    <!-- A matriz é o objeto colorido da página e também a navegação. -->
    <div class="shell panorama">
      <div class="panorama-head">
        <h2 data-i18n="matrix.title"></h2>
        <p data-i18n="matrix.hint"></p>
      </div>
      <div class="matrix-scroll">
        <div id="matrix" class="matrix" role="grid"></div>
      </div>
      <div class="matrix-legend">
        <span data-i18n="matrix.legendLow"></span>
        <span class="legend-ramp" aria-hidden="true"></span>
        <span data-i18n="matrix.legendHigh"></span>
      </div>
      <div id="readouts" class="readouts"></div>
      <p id="gap-note" class="gap-note"></p>
    </div>

    <div class="shell">
      <div class="controls">
        <div class="search">
          <svg class="search-ico" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="m10.6 10.6 3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input type="search" id="search" data-i18n-ph="search.placeholder" />
        </div>
        <div id="selects" class="selects"></div>
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="only-link" /><span data-i18n="filters.onlyLink"></span></label>
          <label class="toggle"><input type="checkbox" id="only-he" /><span data-i18n="filters.onlyHE"></span></label>
        </div>
      </div>
      <div class="result-row">
        <span id="result-count" class="result-count"></span>
        <button type="button" class="text-btn" id="clear-filters" data-i18n="filters.clear"></button>
      </div>
    </div>

    <div class="shell">
      <div class="table-scroll">
        <table class="catalog" id="catalog-table">
          <colgroup>
            <col class="c-study" /><col class="c-tech" /><col class="c-tissue" />
            <col class="c-tumor" /><col class="c-organism" /><col class="c-samples" />
            <col class="c-he" /><col class="c-access" /><col class="c-year" />
          </colgroup>
          <thead id="catalog-head"></thead>
          <tbody id="catalog-body"></tbody>
        </table>
      </div>
    </div>

    <div class="shell portals">
      <h2 data-i18n="portals.title"></h2>
      <p class="portals-lead" data-i18n="portals.lead"></p>
      <ul id="portals-list" class="portals-list"></ul>
    </div>

  </section>

  <!-- ============ Detalhe ============ -->
  <section id="view-detail" class="view">
    <div class="shell" id="detail"></div>
  </section>

  <!-- ============ Submeter ============ -->
  <section id="view-submit" class="view">
    <div class="shell prose-block">
      <h1 data-i18n="submit.title"></h1>
      <p class="lead" data-i18n="submit.lead"></p>
      <ol class="steps">
        <li><h3 data-i18n="submit.step1.title"></h3><p data-i18n="submit.step1.text"></p></li>
        <li><h3 data-i18n="submit.step2.title"></h3><p data-i18n="submit.step2.text"></p></li>
        <li><h3 data-i18n="submit.step3.title"></h3><p data-i18n="submit.step3.text"></p></li>
      </ol>
      <a class="btn" id="submit-link" target="_blank" rel="noopener" data-i18n="submit.cta"></a>
    </div>
  </section>

  <!-- ============ Sobre ============ -->
  <section id="view-about" class="view">
    <div class="shell prose-block">
      <h1 data-i18n="about.title"></h1>
      <p data-i18n="about.p1"></p>
      <p data-i18n="about.p2"></p>
      <p data-i18n="about.p3"></p>
      <div class="about-grid">
        <div>
          <h3 data-i18n="about.curation.title"></h3>
          <p data-i18n="about.curation.text"></p>
        </div>
        <div>
          <h3 data-i18n="about.cite.title"></h3>
          <p data-i18n="about.cite.text"></p>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="shell footer-row">
    <span data-i18n="footer.text"></span>
    <span id="footer-updated"></span>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/schema.js"></script>
<script src="js/panorama.js"></script>
<script src="js/app.js"></script>
</body>
</html>
